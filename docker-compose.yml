version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - todo-net

  app:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
    networks:
      - todo-net

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    networks:
      - todo-net

  frontend:
    build: ./frontend
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    depends_on:
      - app
    networks:
      - todo-net

volumes:
  db-data:

networks:
  todo-net:
    driver: bridge
